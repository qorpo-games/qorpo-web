name: Refresh studio live feed
on:
  # Existing hourly schedule; each source reports independent refresh coverage.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: studio-feed
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Test feed recovery and source isolation
        run: python3 -B tools/test_studio_feed.py
      - name: Read all studio repositories and rebuild the verified feed
        env:
          STUDIO_FEED_READ_TOKEN: ${{ secrets.STUDIO_FEED_READ_TOKEN }}
          TAMITOS_SITE_READ_TOKEN: ${{ secrets.TAMITOS_SITE_READ_TOKEN }}
          TAMITOS_SOURCE_READ_TOKEN: ${{ secrets.TAMITOS_SOURCE_READ_TOKEN }}
        run: python3 tools/update_studio_feed.py
      - name: Save the feed without modifying other files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.json
          git commit -m 'Refresh verified studio live feed'
          git pull --rebase origin master
          git push origin HEAD:master
      # The repository's branch-based Pages workflow publishes this push.
      # A second explicit Pages deployment races it and produces conflict errors.
      - name: Verify the feed published by GitHub Pages
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          expected = json.loads(Path('feed.json').read_text())['updated']
          for attempt in range(36):
              try:
                  request = urllib.request.Request(
                      'https://qorpo.world/feed.json?verify=' + expected,
                      headers={'Cache-Control': 'no-cache', 'User-Agent': 'studio-feed-release-check'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      live = json.load(response)
                  if live.get('updated') == expected:
                      coverage = live.get('coverage', {})
                      print('Public feed verified:', expected, coverage)
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Feed committed but public Pages publication was not verified.')
          PY

